<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reservations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Orbitron:wght@400..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<nav class="navbar navbar-expand-lg">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <img src="images/logo.png"
           alt="The Salty Fox logo"
           width="50">
      The Salty Fox
    </a>
    <button class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="menu.html">Menu</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="reservations.html">Reservations</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container page-content">
  <section class="row reservation-layout">
    <div class="col-lg-5">
      <section class="reservation-intro">
        <h1>Reservations</h1>
        <p>
          Reservations can be requested but are not guaranteed until confirmed.
        </p>
        <img class="reservation-image img-fluid"
             src="images/fox.png"
             alt="Fox server at The Salty Fox">
      </section>
    </div>
    <div class="col-lg-7">
      <section class="card">
        <form id="reservation-form" novalidate>

          <div id="form-message"></div>
          <label for="name">Name:</label>
          <input type="text"
                 id="name"
                 name="name"
                 class="form-control">
          <label for="email">Email:</label>
          <input type="email"
                 id="email"
                 name="email"
                 class="form-control">
          <label for="party-size">Party Size:</label>
          <select name="party-size"
                  id="party-size"
                  class="form-select">
            <option value="">Choose party size</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
          <label for="date">Date:</label>
          <input type="date"
                 id="date"
                 name="date"
                 class="form-control">
          <label for="time">Time:</label>
          <input type="time"
                 id="time"
                 name="time"
                 class="form-control">
          <fieldset>
            <legend>Seating Preference</legend>
            <input type="radio"
                   id="indoor"
                   name="seating"
                   value="indoor"
                   class="form-check-input">
            <label for="indoor">Indoor</label>
            <input type="radio"
                   id="patio"
                   name="seating"
                   value="patio"
                   class="form-check-input">
            <label for="patio">Patio</label>
            <input type="radio"
                   id="harbor"
                   name="seating"
                   value="harbor"
                   class="form-check-input">
            <label for="harbor">Harbor View</label>
          </fieldset>
          <label for="dietary-notes">Dietary Notes:</label>
          <textarea id="dietary-notes"
                    name="dietary-notes"
                    class="form-control"></textarea>
          <input type="checkbox"
                 id="newsletter"
                 name="newsletter">
          <label class="checkbox-label"
                 for="newsletter">
            Sign up for the Salty Fox newsletter.
          </label>
          <button type="submit"
                  class="btn btn-primary">
            Request Reservation
          </button>
          <button type="reset"
                  class="btn btn-secondary">
            Reset
          </button>
        </form>
      </section>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
