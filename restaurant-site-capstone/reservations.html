<main class="container page-content">
    <section class="row reservation-layout">
        <div class="col-lg-5">
            <section class="reservation-intro">

                <h1>Reservations</h1>

                <p>
                    Reservations can be requested but are not guaranteed
                    until confirmed.
                </p>

                <!-- font awesome calendar for reservations -->
                <i class="fa-solid fa-calendar-days reservation-icon"
                   aria-hidden="true"></i>

                <img class="reservation-image img-fluid"
                     src="images/fox.png"
                     alt="Fox server at The Salty Fox">

            </section>
        </div>

        <div class="col-lg-7">
            <section class="card">
                <form id="reservation-form"
                      novalidate>

                    <div id="form-message"
                         aria-live="polite"></div>


                    <label for="name">
                        Name:
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           class="form-control">


                    <label for="email">
                        Email:
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control">


                    <label for="party-size">
                        Party Size:
                    </label>

                    <select name="party-size"
                            id="party-size"
                            class="form-select">

                        <option value="">
                            Choose party size
                        </option>

                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>

                    </select>


                    <label for="date">
                        Date:
                    </label>

                    <input type="date"
                           id="date"
                           name="date"
                           class="form-control">


                    <label for="time">
                        Time:
                    </label>

                    <input type="time"
                           id="time"
                           name="time"
                           class="form-control">


                    <fieldset>

                        <legend>
                            Seating Preference
                        </legend>

                        <input type="radio"
                               id="indoor"
                               name="seating"
                               value="indoor"
                               class="form-check-input">

                        <label for="indoor">
                            Indoor
                        </label>


                        <input type="radio"
                               id="patio"
                               name="seating"
                               value="patio"
                               class="form-check-input">

                        <label for="patio">
                            Patio
                        </label>


                        <input type="radio"
                               id="harbor"
                               name="seating"
                               value="harbor"
                               class="form-check-input">

                        <label for="harbor">
                            Harbor View
                        </label>

                    </fieldset>


                    <label for="dietary-notes">
                        Dietary Notes:
                    </label>

                    <textarea id="dietary-notes"
                              name="dietary-notes"
                              class="form-control"></textarea>


                    <input type="checkbox"
                           id="newsletter"
                           name="newsletter">

                    <label class="checkbox-label"
                           for="newsletter">
                        Sign up for the Salty Fox newsletter.
                    </label>


                    <button type="submit"
                            class="btn btn-primary">
                        Submit
                    </button>

                    <button type="reset"
                            class="btn btn-secondary">
                        Reset
                    </button>
                </form>
            </section>
        </div>
    </section>
    <!--  this will lead to the error page-->
    <section class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <p class="error-link">
                Lost at sea?
                <a href="error.html">Find your way back.</a>
            </p>
        </div>
    </section>

</main>
