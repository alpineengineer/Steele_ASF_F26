<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Error | The Salty Fox</title>

    <!-- favicon -->
    <link rel="icon"
          type="image/png"
          href="favicon.png">

    <!-- google fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Orbitron:wght@400..900&display=swap"

    <!-- font awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- bootstrap -->

            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

<body class="error-page">
<main class="container page-content">
    <section class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card error-card">

                <!-- font awesome ship for a lost traveler -->
                <i class="fa-solid fa-ship error-icon"
                   aria-hidden="true"></i>

                <h1>404 - This Ship Has Left the Harbor</h1>

                <p>
                    The page you are looking for seems to have sailed away.
                </p>

                <p>
                    Return to The Salty Fox and we will help you find your way
                    back to familiar waters.
                </p>

                <a class="btn btn-primary"
                   href="index.html">
                    Return Home
                </a>
            </div>
        </div>
    </section>
</main>
<!-- bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
