<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Menu | The Salty Fox</title>

    <!-- favicon -->
    <link rel="icon"
          type="image/png"
          href="favicon.png">

    <!-- google fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Orbitron:wght@400..900&display=swap"
            rel="stylesheet">

    <!-- font awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <!-- bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- custom css -->
    <link rel="stylesheet"
          href="styles.css">

</head>

<body class="menu-page">

<!-- bootstrap navbar -->
<nav class="navbar navbar-expand-lg">

    <div class="container">
        <a class="navbar-brand"
           href="index.html">

            <img src="images/logo.png"
                 alt="The Salty Fox logo"
                 width="50">

            The Salty Fox

            <!-- font awesome anchor icon for the restaurant's coastal theme -->
            <i class="fa-solid fa-anchor"
               aria-hidden="true"></i>

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
                aria-controls="mainNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="mainNavbar">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="menu.html"
                       aria-current="page">
                        Menu
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="reservations.html">
                        Reservations
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="hiring.html">
                        Hiring
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container page-content">
    <section class="row menu-layout">
        <div class="col-lg-5 menu-intro">

            <h1>The Menu</h1>

            <p>
                Our menu has a variety of coastal cuisine and delicious
                desserts. Please ask about our daily soup special.
            </p>
        </div>

        <div class="col-lg-7 menu-picture">

            <img class="menu-image img-fluid"
                 src="images/restaurant_inside.png"
                 alt="Interior of The Salty Fox">

        </div>
    </section>

    <section class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card menu-card">
                <label for="menu-filter">
                    Filter Menu:
                </label>

                <select id="menu-filter"
                        class="form-select menu-filter">

                    <option value="All">
                        All
                    </option>

                    <option value="Breakfast">
                        Breakfast
                    </option>

                    <option value="Lunch">
                        Lunch
                    </option>

                    <option value="Dinner">
                        Dinner
                    </option>

                </select>

                <div id="menu-item">

                    <img id="menu-item-image"
                         class="menu-item-image img-fluid"
                         src="images/fox.png"
                         alt="Menu item">

                    <h2 id="menu-item-name">
                        Menu Item
                    </h2>

                    <p id="menu-item-description">
                        Description
                    </p>

                    <p id="menu-item-category">
                        Category
                    </p>

                    <p id="menu-item-price">
                        Price
                    </p>

                </div>

                <div class="menu-buttons">

                    <button id="prev-button"
                            type="button"
                            class="btn btn-secondary">
                        PREV
                    </button>

                    <button id="next-button"
                            type="button"
                            class="btn btn-primary">
                        NEXT
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- this will lead to the error page  -->
    <section class="row justify-content-center">
        <div class="col-lg-8 text-center">
            <p class="error-link">
                Lost at sea?
                <a href="error.html">
                    Find your way back.
                </a>
            </p>
        </div>
    </section>
</main>

<!-- bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<!-- custom JS -->
<script src="script.js"></script>
</body>
</html>
