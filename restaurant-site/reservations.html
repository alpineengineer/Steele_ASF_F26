<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>reservations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Orbitron:wght@400..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<nav class="navbar">
  <div class="logo">The Salty Fox</div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="menu.html">
      <i class="fa-solid fa-fish-fins"></i>Menu</a></li>
    <li><a href="reservations.html">Reservations</a></li>
  </ul>
</nav>

<main>
  <section class="reservation-intro">
    <h1>Reservations</h1>
    <p>Reservations can be requested but are not guaranteed until confirmed.</p>
    <img class="reservation-image" src="images/fox.png" alt="Fox server at The Salty Fox">
  </section>
  <section class="card">
    <form>
      <label for="name">Name:</label>
      <input type="text"
             id="name"
             name="name"
             maxlength="20"
             required>

      <label for="email">Email:</label>
      <input type="email"
             id="email"
             name="email"
             required>

      <label for="party-size">Party Size:</label>
      <select name="party-size" id="party-size" required>
        <option value="">Choose party size</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>

      </select>
      <label for="date">Date:</label>
      <input type="date"
             id="date"
             name="date"
             required>

      <label for="time">Time:</label>
      <input type="time"
             id="time"
             name="time"
             required>

      <fieldset>
        <legend>Seating Preference</legend>

        <input type="radio"
               id="indoor"
               name="seating"
               value="indoor"
               required>
        <label for="indoor">Indoor</label>

        <input type="radio"
               id="patio"
               name="seating"
               value="patio">
        <label for="patio">Patio</label>

        <input type="radio"
               id="harbor"
               name="seating"
               value="harbor">
        <label for="harbor">Harbor View</label>
      </fieldset>
      <label for="dietary-notes">Dietary Notes:</label>
      <textarea
        id="dietary-notes"
        name="dietary-notes"
        maxlength="30"></textarea>
      <input type="checkbox"
             id="newsletter"
             name="newsletter">
      <label class="checkbox-label" for="newsletter">Sign up for the Salty Fox newsletter.</label>
      <button type="submit">Request Reservation</button>
      <button type="reset">Reset</button>
    </form>

  </section>
</main>


</body>
</html>
